<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>convert</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){}</script>
</head>
<body>
<button id="theme" class="ghost corner" aria-label="Toggle dark / light theme">[ ◐ ]</button>
<main id="app" tabindex="-1"></main>
<footer>
<p>everything runs locally<br>no files are uploaded or stored on a server</p>
<p><a id="gh" href="#" rel="noopener">github →</a></p>
</footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
